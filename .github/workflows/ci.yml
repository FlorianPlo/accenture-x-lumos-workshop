name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      # Informational: shows which months/customers still fail (e.g. open bugs).
      # Does not block the PR. pytest above is the gate.
      - name: Smoke test the billing run (informational)
        continue-on-error: true
        run: |
          for month in 2026-10 2026-11 2026-12; do
            echo "::group::wattwise run $month"
            python -m wattwise run "$month"
            echo "::endgroup::"
          done
