# @claude mentions: the human review loop.
#
# Comment "@claude ..." on an issue or a pull request (e.g. on the agent's draft PR:
# "@claude the reviewer asks for a test for 6-digit meters") and Claude works on it
# with the same rules (CLAUDE.md). Only people with write access can trigger it.

name: Claude (@claude mentions)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "fix/"
          use_sticky_comment: "true"
          claude_args: >-
            --max-turns 60
            --append-system-prompt "Follow CLAUDE.md strictly. For bug fixes follow .claude/agent/bugfix-workflow.md. Run python -m pytest before and after every change. Never push to main."
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,
            Bash(python -m pytest*),Bash(pytest*),Bash(python -m wattwise*),
            Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git blame*),
            Bash(git add*),Bash(git commit*),Bash(git stash*),
            Bash(gh issue view*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr list*)"
            --disallowedTools "Bash(git push*main*),Bash(git push*--force*),Bash(gh pr merge*),
            Bash(gh secret*),Bash(curl*),Bash(wget*)"
